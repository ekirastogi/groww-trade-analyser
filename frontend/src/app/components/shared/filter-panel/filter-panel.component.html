<div class="filter-panel card overflow-hidden">
  <div
    class="filter-panel-head"
    [class.cursor-pointer]="collapsible()"
    (click)="collapsible() && toggleExpanded()"
  >
    <h3 class="filter-panel-title">
      <svg class="h-3.5 w-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
      More filters
      @if (activeFilterCount() > 0) {
        <span class="filter-panel-badge">{{ activeFilterCount() }}</span>
      }
    </h3>
    @if (collapsible()) {
      <svg class="h-3.5 w-3.5 text-slate-400 transition" [class.rotate-180]="filtersExpanded()" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    }
  </div>

  @if (!collapsible() || filtersExpanded()) {
    <div class="filter-panel-body">
      @if (showDateRange()) {
        <app-date-range-filter variant="panel" />
      }

      <div class="filter-panel-row">
        @if (showChartFilters()) {
          <label class="filter-panel-field">
            <span>Chart</span>
            <select class="filter-panel-select" [ngModel]="chartPeriod()" (ngModelChange)="chartPeriod.set($event)">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </label>
          <label class="filter-panel-field">
            <span>Top</span>
            <select class="filter-panel-select" [ngModel]="topStocksCount()" (ngModelChange)="topStocksCount.set(+$event)">
              <option [value]="5">5</option>
              <option [value]="10">10</option>
              <option [value]="15">15</option>
              <option [value]="20">20</option>
            </select>
          </label>
        }

        @if (showTradeTypes()) {
          <div class="filter-panel-chips">
            @for (type of availableTradeTypes(); track type) {
              <button
                type="button"
                class="chip !px-2 !py-0.5 !text-[11px]"
                [class.chip-active]="isTradeTypeSelected(type)"
                [class.chip-inactive]="!isTradeTypeSelected(type)"
                (click)="toggleTradeType(type)"
              >{{ tradeTypeLabels[type] || type }}</button>
            }
          </div>
        }

        <div class="filter-panel-actions">
          <button type="button" class="btn-primary !px-2.5 !py-1 !text-xs" (click)="applyFilters()">Apply</button>
          <button type="button" class="btn-secondary !px-2.5 !py-1 !text-xs" (click)="resetFilters()">Reset</button>
        </div>
      </div>
    </div>
  }
</div>
