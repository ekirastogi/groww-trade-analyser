<div class="period-filter" [class.period-filter-panel]="variant() === 'panel'">
  <div class="period-track" role="radiogroup" aria-label="Date range">
    @for (preset of presets; track preset.id) {
      <button
        type="button"
        role="radio"
        class="period-seg"
        [class.period-seg-active]="isPresetActive(preset.id)"
        [attr.aria-checked]="isPresetActive(preset.id)"
        [attr.title]="preset.label"
        (click)="selectPreset(preset.id)"
      >
        {{ preset.shortLabel }}
      </button>
    }
    <button
      type="button"
      role="radio"
      class="period-seg"
      [class.period-seg-active]="showCustomDates()"
      [attr.aria-checked]="showCustomDates()"
      title="Custom range"
      (click)="toggleCustom()"
    >
      Custom
    </button>
  </div>

  @if (showCustomDates()) {
    <div class="period-custom">
      <input
        type="date"
        class="period-date"
        aria-label="From"
        [min]="bounds().min"
        [max]="bounds().max || state.endDate()"
        [ngModel]="state.startDate()"
        (ngModelChange)="onCustomDateChange('start', $event)"
      />
      <span class="period-dash" aria-hidden="true">–</span>
      <input
        type="date"
        class="period-date"
        aria-label="To"
        [min]="bounds().min || state.startDate()"
        [max]="bounds().max"
        [ngModel]="state.endDate()"
        (ngModelChange)="onCustomDateChange('end', $event)"
      />
    </div>
  } @else if (rangeCaption()) {
    <span class="period-caption tabular-nums">{{ rangeCaption() }}</span>
  }
</div>
