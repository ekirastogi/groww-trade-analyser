<div class="date-range-filter" [class.date-range-filter-panel]="variant() === 'panel'">
  <div class="date-range-filter-head">
    <span class="date-range-filter-kicker">Session</span>
    <span class="date-range-filter-caption tabular-nums">{{ rangeCaption() }}</span>
  </div>

  <div class="date-range-presets" role="radiogroup" aria-label="Date range">
    @for (preset of presets; track preset.id) {
      <button
        type="button"
        role="radio"
        class="date-range-preset"
        [class.date-range-preset-active]="isPresetActive(preset.id)"
        [attr.aria-checked]="isPresetActive(preset.id)"
        [attr.title]="preset.label"
        (click)="selectPreset(preset.id)"
      >
        <span class="date-range-preset-short">{{ preset.shortLabel }}</span>
        <span class="date-range-preset-full">{{ preset.label }}</span>
      </button>
    }
  </div>

  <div class="date-range-custom">
    <label class="date-range-field">
      <span>From</span>
      <input
        type="date"
        class="date-range-input"
        [min]="bounds().min"
        [max]="bounds().max || state.endDate()"
        [ngModel]="state.startDate()"
        (ngModelChange)="onCustomDateChange('start', $event)"
      />
    </label>
    <span class="date-range-sep" aria-hidden="true">→</span>
    <label class="date-range-field">
      <span>To</span>
      <input
        type="date"
        class="date-range-input"
        [min]="bounds().min || state.startDate()"
        [max]="bounds().max"
        [ngModel]="state.endDate()"
        (ngModelChange)="onCustomDateChange('end', $event)"
      />
    </label>
  </div>
</div>
