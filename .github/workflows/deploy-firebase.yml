# Optional manual Firebase deploy from GitHub Actions.
#
# Day-to-day deploys use ./scripts/ship.sh (local Firebase CLI login).
# Auto-deploy on push was disabled because it duplicated ship.sh and failed when
# GitHub repo secrets were missing/expired — causing failure notification emails.
#
# To use this workflow manually, set GitHub repo secrets:
#   FIREBASE_TOKEN      — firebase login:ci
#   SUPABASE_URL        — Supabase project URL
#   SUPABASE_ANON_KEY   — Supabase anon key
#   FIREBASE_WEB_CONFIG — (optional) full Firebase web config JSON; else uses CLI + token

name: Deploy to Firebase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate secrets
        run: |
          test -n "${{ secrets.FIREBASE_TOKEN }}" || { echo "Missing FIREBASE_TOKEN secret"; exit 1; }
          test -n "${{ secrets.SUPABASE_URL }}" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || { echo "Missing SUPABASE_ANON_KEY secret"; exit 1; }

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build and deploy
        working-directory: frontend
        run: npm run deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
