# Build / lint / test gate.
#
# Deliberately requires NO repository secrets: the example env configs are copied into place
# so the bundle compiles, and nothing here talks to Firebase or Supabase. That's what makes it
# safe to run on every push, unlike the manual deploy workflow which needs live credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # The real configs are gitignored. Placeholders are enough to typecheck and bundle.
      - name: Stage placeholder env config
        working-directory: frontend/src/environments
        run: |
          cp -n firebase.config.example.ts firebase.config.ts || true
          cp -n supabase.config.example.ts supabase.config.ts || true

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production
