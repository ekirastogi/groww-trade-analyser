<div class="flex min-h-screen min-h-dvh bg-slate-50">
  @if (isMobile() && sidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/50 lg:hidden" (click)="closeSidebar()"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-50 flex w-64 flex-col bg-sidebar text-slate-400 transition-transform duration-300"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
  >
    <div class="flex items-center justify-between border-b border-white/10 px-4 py-4 sm:px-5">
      <div class="text-lg font-bold text-white">📈 Groww Trader</div>
      <button type="button" class="rounded-lg p-1.5 text-slate-400 transition hover:bg-white/10 hover:text-white" (click)="closeSidebar()" aria-label="Close sidebar">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
      </button>
    </div>
    <nav class="flex-1 space-y-1 p-3">
      <a routerLink="/" routerLinkActive="bg-brand-500/15 text-white border-l-2 border-brand-500" [routerLinkActiveOptions]="{ exact: true }"
         class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/5 hover:text-white" (click)="onNavigate()">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        Recommendations
      </a>
      <a routerLink="/dashboard" routerLinkActive="bg-brand-500/15 text-white border-l-2 border-brand-500"
         class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/5 hover:text-white" (click)="onNavigate()">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        Trade Dashboard
      </a>
      <a routerLink="/upload" routerLinkActive="bg-brand-500/15 text-white border-l-2 border-brand-500"
         class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/5 hover:text-white" (click)="onNavigate()">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        Upload File
      </a>
      <a routerLink="/analytics" routerLinkActive="bg-brand-500/15 text-white border-l-2 border-brand-500"
         class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/5 hover:text-white" (click)="onNavigate()">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Analytics
      </a>
      <a routerLink="/watchlists" routerLinkActive="bg-brand-500/15 text-white border-l-2 border-brand-500"
         class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/5 hover:text-white" (click)="onNavigate()">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5h14M5 12h14M5 19h14"/></svg>
        Watchlists
      </a>
      <a routerLink="/heatmap" routerLinkActive="bg-brand-500/15 text-white border-l-2 border-brand-500"
         class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/5 hover:text-white" (click)="onNavigate()">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        Heatmap
      </a>
    </nav>
    <div class="border-t border-white/10 p-3">
      @if (auth.user(); as user) {
        <div class="flex items-center justify-between gap-2 text-xs">
          <span class="truncate text-slate-400">{{ user.email }}</span>
          <button type="button" class="shrink-0 text-brand-400 hover:text-white" (click)="logout()">Logout</button>
        </div>
      }
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col transition-[margin] duration-300" [class.lg:ml-64]="sidebarOpen()">
    <header class="sticky top-0 z-30 flex items-center gap-3 border-b border-slate-200 bg-white px-4 py-3 sm:px-6">
      <button type="button" class="rounded-lg p-1.5 text-slate-600 hover:bg-slate-100" (click)="toggleSidebar()">
        @if (sidebarOpen()) {
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
        } @else {
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        }
      </button>
      <h1 class="text-base font-bold text-slate-900 sm:text-lg">Groww Trader</h1>
    </header>
    <main class="flex-1 px-3 py-4 sm:px-6 sm:py-6 pb-20 lg:pb-6">
      <router-outlet />
    </main>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 z-30 flex border-t border-slate-200 bg-white pb-safe lg:hidden">
    <a routerLink="/" routerLinkActive="text-brand-600" [routerLinkActiveOptions]="{ exact: true }" class="flex flex-1 flex-col items-center gap-0.5 py-2 text-xs font-medium text-slate-500" (click)="onNavigate()">Signals</a>
    <a routerLink="/dashboard" routerLinkActive="text-brand-600" class="flex flex-1 flex-col items-center gap-0.5 py-2 text-xs font-medium text-slate-500" (click)="onNavigate()">Dashboard</a>
    <a routerLink="/upload" routerLinkActive="text-brand-600" class="flex flex-1 flex-col items-center gap-0.5 py-2 text-xs font-medium text-slate-500" (click)="onNavigate()">Upload</a>
  </nav>
</div>

@if (state.loading()) {
  <div class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900/60">
    <div class="h-10 w-10 animate-spin rounded-full border-4 border-white/30 border-t-brand-500"></div>
    <span class="mt-4 text-sm font-medium text-white">Processing report...</span>
  </div>
}
